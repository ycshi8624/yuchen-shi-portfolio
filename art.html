<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art — Yuchen Shi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/gallery.css">
</head>
<body class="gallery-page">
  <div class="subpage-spacer" data-subpage-spacer aria-hidden="true"></div>
  <header class="subpage-header fade fade--1" data-sticky-header>
    <div class="rule-bar">
      <i class="rule-bar__seg rule-bar__seg--lead" aria-hidden="true"></i>
      <span class="rule-bar__letter">a</span>
      <i class="rule-bar__seg" aria-hidden="true"></i>
      <span class="rule-bar__letter">r</span>
      <i class="rule-bar__seg" aria-hidden="true"></i>
      <span class="rule-bar__letter">t</span>
      <i class="rule-bar__seg rule-bar__seg--grow" aria-hidden="true"></i>
      <a href="index.html" class="rule-bar__home" aria-label="Home">
        <img src="images/signature.png?v=2" alt="Home" class="rule-bar__signature">
      </a>
      <i class="rule-bar__seg rule-bar__seg--trail" aria-hidden="true"></i>
    </div>
  </header>

  <main class="gallery">
    <section class="gallery-group fade fade--2" data-slideshow>
      <h2 class="gallery-group__title">fine arts</h2>
      <div class="slideshow__info">
        <p class="slideshow__title">add to cart</p>
        <p class="slideshow__year">2026</p>
      </div>
      <div class="slideshow__carousel">
        <button class="slideshow__control" type="button" aria-label="Previous slide" data-prev>&larr;</button>
        <div class="slideshow__scroll" tabindex="0">
          <div class="slideshow__track">
        <figure class="slideshow__slide" data-title="add to cart" data-year="2026">
          <img src="art/%22add%20to%20cart%22%20%3A%202026%20%3A%20acrylic%20on%20canvas%20%3A%2012%20x%2018%20in.JPG" alt="add to cart" loading="lazy">
        </figure>
        <figure class="slideshow__slide" data-title="nostalgia" data-year="2023">
          <img src="art/nostalgia%20%3A%202023%20%3A%20graphite%20and%20colored%20pencils%20on%20paper%20%3A%207%20x%2011.5%20inches.jpg" alt="nostalgia" loading="lazy">
        </figure>
        <figure class="slideshow__slide" data-title="bouquet of exploitation" data-year="2022">
          <img src="art/bouquet%20of%20exploitation%20%3A%202022%20%3A%20oil%20on%20canvas%20%3A%2050%20x%2040%20cm.jpg" alt="bouquet of exploitation" loading="lazy">
        </figure>
        <figure class="slideshow__slide" data-title="long-dang li" data-year="2022">
          <img src="art/long-dang%20li%20%3A%202022%20%3A%20oil%20on%20canvas%20%3A%2060%20x%20120%20cm.jpg" alt="long-dang li" loading="lazy">
        </figure>
        <figure class="slideshow__slide" data-title="mirage" data-year="2022">
          <img src="art/mirage%20%3A%202022%20%3A%20oil%20on%20canvas%20%3A%2060%20x%20120%20cm.jpg" alt="mirage" loading="lazy">
        </figure>
        <figure class="slideshow__slide" data-title="urbanites" data-year="2022">
          <img src="art/urbanites%20%3A%202022%20%3A%20oil%20on%20canvas%20%3A%2090%20x%2060%20cm.jpg" alt="urbanites" loading="lazy">
        </figure>
        <figure class="slideshow__slide" data-title="vertigo" data-year="2022">
          <img src="art/vertigo%20%3A%202022%20%3A%20oil%20on%20wooden%20panel%20%3A%2030%20x%2020%20cm.JPG" alt="vertigo" loading="lazy">
        </figure>
                  </div>
        </div>
        <button class="slideshow__control" type="button" aria-label="Next slide" data-next>&rarr;</button>
      </div></section>

    <section class="gallery-group fade fade--3" data-slideshow>
      <h2 class="gallery-group__title">digital</h2>
      <div class="slideshow__info">
        <p class="slideshow__title">blow-up</p>
        <p class="slideshow__year">2023</p>
      </div>
      <div class="slideshow__carousel">
        <button class="slideshow__control" type="button" aria-label="Previous slide" data-prev>&larr;</button>
        <div class="slideshow__scroll" tabindex="0">
          <div class="slideshow__track">
        <figure class="slideshow__slide" data-title="blow-up" data-year="2023">
          <img src="art/blow-up%20%3A%202023%20%3A%203d%20model%20created%20using%20cinema%204d.jpg" alt="blow-up" loading="lazy">
        </figure>
        <figure class="slideshow__slide" data-title="induction" data-year="2023">
          <img src="art/induction%20%3A%202023%20%3A%203d%20model%20created%20using%20blender.jpg" alt="induction" loading="lazy">
        </figure>
        <figure class="slideshow__slide" data-title="synced" data-year="2023">
          <video src="art/synced%20%3A%202023%20%3Aanimation%20created%20using%20cinema%204d.mov" controls playsinline preload="metadata"></video>
        </figure>
        <figure class="slideshow__slide" data-title="the paradox of observations" data-year="2023">
          <img src="art/the%20paradox%20of%20observations%20%3A%202023%20%3A%203d%20model%20created%20using%20cinema%204d.jpg" alt="the paradox of observations" loading="lazy">
        </figure>
        <figure class="slideshow__slide" data-title="fluidscapes" data-year="2022">
          <video src="art/fluidscapes%20%3A%202022%20%3A%20animation%20created%20using%20cinema%204d%3B%20yarn%2C%20wire%2C%20tibetan%20singing%20bowl.mp4" controls playsinline preload="metadata"></video>
        </figure>
                  </div>
        </div>
        <button class="slideshow__control" type="button" aria-label="Next slide" data-next>&rarr;</button>
      </div></section>
  </main>

  <script src="js/transition.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
